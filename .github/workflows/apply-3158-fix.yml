name: Apply issue 3158 fix

on:
  push:
    branches:
      - fix/plugin-manifest-case-sensitive

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix(plugins): make manifest path comparison case-sensitive') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply case-sensitive comparisons
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/plugins/Sync-PluginManifest.ps1')
          text = path.read_text()
          replacements = {
              "$expectedPaths | Where-Object { $_ -notin $committedPaths }":
                  "$expectedPaths | Where-Object { $_ -cnotin $committedPaths }",
              "$committedPaths | Where-Object { $_ -notin $expectedPaths }":
                  "$committedPaths | Where-Object { $_ -cnotin $expectedPaths }",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected comparison not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Validate diff
        run: |
          git diff --check
          git diff -- scripts/plugins/Sync-PluginManifest.ps1

      - name: Commit fix and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-3158-fix.yml
          git add scripts/plugins/Sync-PluginManifest.ps1 .github/workflows/apply-3158-fix.yml
          git commit -m 'fix(plugins): make manifest path comparison case-sensitive'
          git push origin HEAD:fix/plugin-manifest-case-sensitive
